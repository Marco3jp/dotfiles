# マウス操作（スクロール・ペイン選択・リサイズ）
set -g mouse on

# フォーカスイベントを アプリ（Claude Code / vim 等）に伝える
set -g focus-events on

# 256色 + truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Esc の遅延をなくす（vim / Claude Code のキー入力が速くなる）
set -sg escape-time 10

# スクロールバック履歴を増やす
set -g history-limit 50000

# Shift+Enter 等の拡張キーをアプリに渡す
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# OSC 52 でクリップボードにコピー
set -g set-clipboard on

# ペイン内アプリのパススルー（通知など）
set -g allow-passthrough on

# ---- ステータスバー（byobu の表示を上書き） ----
set -g status-interval 5
set -g status 2
# 番号を詰めて、2行への振り分けが偏らないようにする
set -g renumber-windows on
# タブのラベル: Claude Code なら作業名（先頭の ✳ / スピナーを除去）、それ以外はウィンドウ名
# 状態色: 作業中=黄 #ffc66d、入力待ち(許可確認など)=青 #589df6、Idle=通常色（Claude Code の hooks が @claude_state を書き込む）
set -g @tab '#{?#{==:#{@claude_state},busy},#[fg=#ffc66d],#{?#{==:#{@claude_state},wait},#[fg=#589df6],}}#I:#{?#{==:#{pane_current_command},claude},#{=/40/…:#{s/^[^ ]* //:pane_title}},#W}#[fg=default]'
# 前半のウィンドウか（index < ceil(n/2)）
set -g @first-half '#{e|<:#{window_index},#{e|/:#{e|+:#{session_windows},1},2}}'
set -g status-right "#[fg=#808080]mem #(~/.config/tmux/mem.sh) | %m/%d %H:%M "
# 1行目: 前半のタブ
set -g status-format[0] '#[align=left]#{W:#{?#{E:@first-half},#[range=window|#{window_index}] #{E:@tab} #[norange default],},#{?#{E:@first-half},#[range=window|#{window_index} bg=#4e5254 bold] #{E:@tab} #[norange default],}}'
# 2行目: 後半のタブ + メモリ・時計
set -g status-format[1] '#[align=left]#{W:#{?#{E:@first-half},,#[range=window|#{window_index}] #{E:@tab} #[norange default]},#{?#{E:@first-half},,#[range=window|#{window_index} bg=#4e5254 bold] #{E:@tab} #[norange default]}}#[align=right]#{T:status-right}'

# ---- 配色（JetBrains Darcula） ----
set -g status-style "bg=#2b2b2b,fg=#a9b7c6"
set -g pane-border-style "fg=#515151"
set -g pane-active-border-style "fg=#6897bb"
set -g message-style "bg=#3c3f41,fg=#a9b7c6"
set -g message-command-style "bg=#3c3f41,fg=#a9b7c6"
set -g mode-style "bg=#214283,fg=#a9b7c6"
set -g display-panes-active-colour "#6897bb"
set -g display-panes-colour "#808080"
set -g clock-mode-colour "#cc7832"
